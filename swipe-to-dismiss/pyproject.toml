[project]
name = "swipe-to-dismiss"
version = "1.0.0"
description = "An inbox where you swipe emails away to archive or delete them, with undo."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Inbox"
