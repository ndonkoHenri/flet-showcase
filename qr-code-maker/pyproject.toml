[project]
name = "qr-code-maker"
version = "1.0.0"
description = "Make a QR code for text, a Wi-Fi network or a contact with segno, redrawn as you type."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "segno==1.6.6"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Make a QR code"
