[project]
name = "map-tour"
version = "1.0.0"
description = "A walking tour of Paris on a map: numbered pins, a route line that grows, and flights between stops."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-map==1.1.2"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Map tour"
