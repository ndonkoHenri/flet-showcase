[project]
name = "animated-line-chart"
version = "1.0.0"
description = "A revenue chart whose line grows month by month, animated, with a dashed comparison line."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-charts==1.1.2"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Revenue"
