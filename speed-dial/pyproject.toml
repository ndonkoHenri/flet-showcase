[project]
name = "speed-dial"
version = "1.0.0"
description = "A notes app whose + button fans out into four labeled actions over a dimmed screen."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Speed dial"
