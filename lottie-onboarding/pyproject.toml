[project]
name = "lottie-onboarding"
version = "1.0.0"
description = "An onboarding flow of four Lottie animations played from web links, with swipes, page dots and Skip."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-lottie==1.1.2"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Lottie onboarding"
