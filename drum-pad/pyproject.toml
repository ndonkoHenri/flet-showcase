[project]
name = "drum-pad"
version = "1.0.0"
description = "A drum pad whose eight sounds are computed in Python with NumPy and played by flet-audio."
requires-python = ">=3.11"
dependencies = [
    "flet==1.1.2",
    "flet-audio==1.1.2",
    "numpy==2.4.6"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Drum pad"
