[project]
name = "barcode-scanner"
version = "1.0.0"
description = "Read barcodes and QR codes from a photo with pyzbar, outline them and list what they say."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "pillow==12.2.0",
    "pyzbar==0.1.9"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Scan a barcode"
