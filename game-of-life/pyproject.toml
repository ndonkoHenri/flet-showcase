[project]
name = "game-of-life"
version = "1.0.0"
description = "Conway's Game of Life with NumPy, drawn on one Canvas: tap cells, then press Play."
requires-python = ">=3.11"
dependencies = [
    "flet==1.1.2",
    "numpy==2.4.6"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Game of Life"
