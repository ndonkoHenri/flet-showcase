[project]
name = "dodge-game"
version = "1.0.0"
description = "A tiny arcade game: drag or use the arrow keys to dodge the falling blocks."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Dodge"
