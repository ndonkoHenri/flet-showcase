[project]
name = "hero-animation"
version = "1.0.0"
description = "A photo gallery where each photo flies into its own page with a Hero animation."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2"
]

[dependency-groups]
dev = ["flet-cli==1.1.2", "flet-desktop==1.1.2", "flet-web==1.1.2"]

[tool.flet]
org = "com.example"
product = "Gallery"
